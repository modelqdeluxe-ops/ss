<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Criaturas con esqueleto</title>
<style>body { margin: 0; background: #2b2a33; color: #ddd; font: 12px monospace; } canvas { image-rendering: pixelated; display: block; }</style></head>
<body>
<canvas id="c"></canvas>
<script src="../js/arte.js"></script>
<script src="../js/escultor.js"></script>
<script src="../js/mano.js"></script>
<script src="../js/anim-esqueleto.js"></script>
<script src="../js/anim-baba.js"></script>
<script src="../js/anim-murcielago.js"></script>
<script src="../js/anim-dragon.js"></script>
<script src="../js/criaturas-mano.js"></script>
<script src="../js/criaturas-esq.js"></script>
<script src="../js/criaturas-fichas.js"></script>
<script>
// Hornea solo las criaturas pedidas (#tipos=a,b&zoom=4) y las pinta: cada fila una animación, sobre gris y sobre
// suelo oscuro con luz (para ver el contorno y la capa que brilla). window.MEDIDAS: tamaño de cada cuadro.
const q = new URLSearchParams(location.hash.slice(1));
const tipos = (q.get('tipos') || Object.keys(CRI.DEF).join(',')).split(','), Z = Number(q.get('zoom') || 4), soloAnim = q.get('anims');
const c = document.getElementById('c'), x = c.getContext('2d');
const filas = [];
window.MEDIDAS = {};
const t0 = performance.now();
for (const t of tipos) {
  const hechos = CRI.hornear(t), porAnim = {};
  for (const [n, r] of hechos) { const a = n.slice(t.length + 1).replace(/[0-9]+$/, ''); if (soloAnim && !soloAnim.includes(a)) continue; (porAnim[a] = porAnim[a] || []).push([n, r]); }
  let w = 0, h = 0;
  for (const [, r] of hechos) { w = Math.max(w, r.color.w); h = Math.max(h, r.color.h); }
  MEDIDAS[t] = { w, h, cuadros: hechos.length };
  for (const [a, lista] of Object.entries(porAnim)) filas.push([t, a, lista]);
}
const tHorno = performance.now() - t0;
const pad = 6;
let W = 0, H = 30;
for (const [, , lista] of filas) { let w = 150; for (const [, r] of lista) w += r.color.w * Z + pad; W = Math.max(W, w); H += Math.max(...lista.map(([, r]) => r.color.h)) * Z + pad * 3; }
c.width = Math.min(W, 6000); c.height = Math.min(H, 16000);
x.fillStyle = '#3a3942'; x.fillRect(0, 0, c.width, c.height);
x.fillStyle = '#ddd'; x.fillText(`horneado ${Math.round(tHorno)} ms`, 6, 14);
let y = 30;
for (const [t, a, lista] of filas) {
  const h = Math.max(...lista.map(([, r]) => r.color.h)) * Z;
  x.fillStyle = '#d8d4e0'; x.fillText(`${t} ${a}`, 6, y + 12); x.fillStyle = '#9a96a8'; x.fillText(`${MEDIDAS[t].w}×${MEDIDAS[t].h}`, 6, y + 26);
  let px = 150;
  for (const [, r] of lista) {
    const L = r.color, oy = y + h - L.h * Z;
    for (let j = 0; j < L.h; j++) for (let i = 0; i < L.w; i++) { const col = L.d[j * L.w + i]; if (col) { x.fillStyle = col; x.fillRect(px + i * Z, oy + j * Z, Z, Z); } }
    if (r.luz) for (let j = 0; j < L.h; j++) for (let i = 0; i < L.w; i++) if (r.luz.d[j * L.w + i]) { x.fillStyle = '#ffffff'; x.fillRect(px + i * Z + Z / 2 - 1, oy + j * Z + Z / 2 - 1, 2, 2); }
    // la base (pies) y el centro de la criatura
    x.fillStyle = 'rgba(255,90,90,0.6)'; x.fillRect(px + (L.w / 2 - r.dx * 16) * Z - 1, y + h + 2, 2, 4);
    px += L.w * Z + pad;
  }
  y += h + pad * 3;
}
window.LISTO = true;
</script>
</body>
</html>
