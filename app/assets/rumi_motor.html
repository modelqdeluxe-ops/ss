<!doctype html>
<meta charset="utf-8">
<title>Rumi motor</title>
<!-- Motor de comprensión de Rumi: modelo de embeddings (multilingual-e5-base ajustado para
     engorde) que convierte la pregunta en un vector y la compara con los temas de la Guía y con
     miles de preguntas de ejemplo. No escribe texto: solo dice a qué tema se parece la pregunta.
     Corre en un iframe con origen https://rumentis.local porque desde file:// el navegador no deja
     arrancar el worker de wllama. Habla con la app por postMessage (ver rumi_entiende.js). -->
<script type="module">
const BASE='https://rumentis.local/';
let w=null,ref=null;
const decir=m=>parent.postMessage({rumiMotor:1,...m},'*');
const blobDe=async(ruta,tipo)=>{const r=await fetch(BASE+ruta);if(!r.ok)throw new Error('No encontré '+ruta);const b=await r.blob();return tipo?new Blob([b],{type:tipo}):b;};
const url=async(r,t)=>URL.createObjectURL(await blobDe(r,t));

async function cargar(){
  const man=await (await fetch(BASE+'rumi/modelo.json')).json();
  // Referencias: vectores int8 (uno por fila) con su escala, y la clase de cada fila.
  const buf=await (await blobDe('rumi/'+man.referencias.vectores)).arrayBuffer();
  const n=man.referencias.filas,d=man.referencias.dim;
  ref={n,d,q:new Int8Array(buf,0,n*d),esc:new Float32Array(buf.slice(n*d,n*d+n*4)),clase:man.referencias.clase_de_fila,clases:man.referencias.clases};
  const {Wllama}=await import(BASE+'wllama/index.js');
  const wasm=await url('wllama/wllama.wasm','application/wasm');
  const nada=()=>{};
  w=new Wllama({default:wasm,'wllama.wasm':wasm},{suppressNativeLog:true,allowOffline:true,logger:{debug:nada,log:nada,info:nada,warn:nada,error:console.error}});
  w.setCompat({worker:BASE+'wllama/compat/wllama.js',wasm:await url('wllama/compat/wllama.wasm','application/wasm')});
  const partes=[];for(const f of man.archivos)partes.push(await blobDe('rumi/'+f));
  // Siempre en CPU (n_gpu_layers 0): resultados iguales en todos los teléfonos.
  await w.loadModel([new Blob(partes)],{embeddings:true,pooling_type:'mean',n_ctx:512,n_batch:512,n_gpu_layers:0,
    n_threads:Math.max(1,Math.min(4,(navigator.hardwareConcurrency||2)-2))});
  // Prueba de salud: el vector de una frase conocida debe parecerse a su propio tema.
  const v=await vector('¿qué es la acidosis?');
  if(!v||v.some(x=>!Number.isFinite(x)))throw new Error('El modelo devolvió vectores inválidos');
  return man;
}

async function vector(texto){
  const r=await w.createEmbedding({input:'query: '+String(texto).slice(0,300)});
  const e=r.data[0].embedding;let s=0;for(const x of e)s+=x*x;s=Math.sqrt(s)||1;
  return Float32Array.from(e,x=>x/s);
}

async function entender(texto){
  const v=await vector(texto),{n,d,q,esc,clase,clases}=ref;
  const mejor=new Float32Array(clases.length).fill(-1);
  for(let i=0;i<n;i++){let s=0;const b=i*d;for(let k=0;k<d;k++)s+=q[b+k]*v[k];s*=esc[i];const c=clase[i];if(s>mejor[c])mejor[c]=s;}
  const orden=[...mejor.keys()].sort((a,b)=>mejor[b]-mejor[a]).slice(0,6);
  return orden.map(c=>({c:clases[c],s:+mejor[c].toFixed(4)}));
}

addEventListener('message',e=>{
  const m=e.data||{};
  if(m.rumiApp!==1||m.tipo!=='entender')return;
  entender(m.texto).then(res=>decir({id:m.id,res})).catch(err=>decir({id:m.id,error:String(err&&err.message||err)}));
});

cargar().then(man=>decir({listo:true,modelo:man.version,umbrales:man.umbrales})).catch(e=>decir({error:String(e&&e.message||e)}));
</script>
