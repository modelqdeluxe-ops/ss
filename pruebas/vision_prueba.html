<!doctype html><meta charset="utf-8"><body><script>window.VISION_BASE='./';</script><script src="vision.js"></script>
<script>
async function probar(src){const im=new Image();im.src=src;await im.decode();const r=await Vision.segmentar(im);
  const c=r.lienzo,x=c.getContext('2d'),d=x.getImageData(0,0,r.W,r.H);for(let i=0;i<r.W*r.H;i++)if(r.mask&&r.mask[i]){d.data[i*4]=d.data[i*4]*.4+255*.6;d.data[i*4+1]*=.6;}
  x.putImageData(d,0,0);document.body.appendChild(c);return {score:r.score,area:r.area,ms:Math.round(r.ms),W:r.W,H:r.H,clase:r.clase};}
</script>
