name: TF Client

on:
  push:
    paths:
      - 'tf-client/**'
      - '.github/workflows/tf-client.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compilar el mod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tf-client
    steps:
      - uses: actions/checkout@v4
      # La red de seguridad de los jefes (tools/bosses/verificar.py): el auditor a 0, su autoprueba, las pruebas del
      # conversor y que los jefes publicados sigan igual que sus referencias (simulador de la pelea y fichas: cajas,
      # modelos, colas). Si algo cambia a un jefe que ya existía, la compilación se para hasta aceptarlo a propósito.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verificar los jefes
        run: |
          pip install --quiet numpy pillow pyyaml
          python3 tools/bosses/verificar.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace
      # Un método de un mixin que recibe la propia clase del mixin (p. ej. por `this::metodo`) hace que Forge
      # intente cargar esa clase y el juego crashee al arrancar ("... is invalid"). Se para la compilación.
      - name: Revisar mixins
        run: |
          rm -rf /tmp/chk && mkdir -p /tmp/chk && cd /tmp/chk
          unzip -q -o "$(ls $GITHUB_WORKSPACE/tf-client/build/libs/*.jar | head -n1)" 'net/tierrasfantasticas/tfclient/mixin/*'
          bad=$(for c in net/tierrasfantasticas/tfclient/mixin/*.class; do javap -p "$c" | grep -E "\(.*net\.tierrasfantasticas\.tfclient\.mixin\." || true; done)
          if [ -n "$bad" ]; then echo "::error::Mixin con referencia a su propia clase:"; echo "$bad"; exit 1; fi
          echo "Mixins correctos"
      - uses: actions/upload-artifact@v4
        with:
          name: tfclient-jar
          path: tf-client/build/libs/*.jar
      # La descarga del mod (sin jars en el repo):
      #  - una Release por versión, tfclient-v<mod_version>, con el jar (no se marca como «latest»: el repo tiene otras
      #    Releases, como StickerYa, y su enlace de la última no se toca);
      #  - la Release fija «tfclient», cuyo tfclient.jar se reemplaza en cada versión: el enlace que no cambia nunca
      #    es https://github.com/<repo>/releases/download/tfclient/tfclient.jar
      # Solo en main y solo si esa versión aún no tiene Release (subir mod_version = publicar).
      - name: Publicar la Release de la versión
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          jar=$(ls build/libs/tfclient-*-"$ver".jar | head -n1)
          # el tag NO empieza por «v<número>»: el workflow de Rumentis (otra rama) borra todas las Releases ^v[0-9]
          tag="tfclient-v$ver"
          if gh release view "$tag" >/dev/null 2>&1; then echo "La Release $tag ya existe"; exit 0; fi
          gh release create "$tag" "$jar" --latest=false --title "TF Client $ver" \
            --notes "TF Client $ver. Enlace fijo a la última versión: https://github.com/${{ github.repository }}/releases/download/tfclient/tfclient.jar"
          cp "$jar" /tmp/tfclient.jar
          if ! gh release view tfclient >/dev/null 2>&1; then
            gh release create tfclient --latest=false --title "TF Client (última versión)" \
              --notes "Siempre la última versión de TF Client: descarga tfclient.jar."
          fi
          gh release upload tfclient /tmp/tfclient.jar --clobber
          gh release edit tfclient --title "TF Client (última versión: $ver)" --latest=false
