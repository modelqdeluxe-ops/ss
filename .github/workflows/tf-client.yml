name: TF Client

on:
  push:
    paths:
      - 'tf-client/**'
      - '.github/workflows/tf-client.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compilar el mod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tf-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tfclient-jar
          path: tf-client/build/libs/*.jar

