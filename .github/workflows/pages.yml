# Publica en GitHub Pages las páginas públicas de Rumentis:
#   https://modelqdeluxe-ops.github.io/ss/verificar/   verificación de documentos
#   https://modelqdeluxe-ops.github.io/ss/campo/       la licencia de Rumentis Equipo (el QR de la administración lleva aquí;
#                                                      también en vaquero/, la dirección anterior)
# Una sola vez: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Páginas públicas
on:
  push:
    branches: [main]
    paths: ['verificar/**', 'campo/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}verificar/
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          mkdir -p _sitio/verificar _sitio/campo _sitio/vaquero
          cp verificar/* _sitio/verificar/
          cp campo/* _sitio/campo/
          cp campo/* _sitio/vaquero/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=verificar/"><title>Rumentis</title><a href="verificar/">Verificar un documento</a>\n' > _sitio/index.html
          touch _sitio/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
