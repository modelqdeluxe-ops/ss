# Compila Rumentis y Rumentis Campo (scripts/variantes.sh) y las publica en un solo Release de GitHub.
# La app del dueño se arma con Gradle para llevar Google Play Billing y sus dependencias (scripts/pagos.sh).
#
# Firma: agrega en Settings > Secrets and variables > Actions los secretos
#   KEYSTORE_B64 (el .keystore en base64), KEYSTORE_PASS, KEY_ALIAS (hato) y KEY_PASS.
# Sin ellos, el APK sale firmado con llave de prueba y el AAB sin firmar.
name: Compilar Rumentis

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', 'scripts/**', 'modelo/android/**', '.github/workflows/compilar.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar Rumentis y Rumentis Campo (APK y AAB)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          PAGOS_OBLIGATORIO: '1'
        run: |
          scripts/variantes.sh todo
          VN=$(grep -E '^\s*versionName:' app/apktool.yml | awk '{print $2}')
          echo "VN=$VN" >> "$GITHUB_ENV"
          cd dist && for f in *.apk *.aab; do mv "$f" "${f%.*}-$VN.${f##*.}"; done && ls -la
      - name: Publicar (un solo Release con lo último)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # se borran las compilaciones anteriores de este flujo (tags v…): así en Releases solo queda la última
          gh release list --limit 300 --json tagName -q '.[].tagName' | grep -E '^v[0-9]' | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
          TAG="v$VN-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*-$VN.apk dist/*-$VN.aab \
            --target "$GITHUB_SHA" --latest \
            --title "Rumentis $VN" \
            --notes "Instala Rumentis-$VN.apk en el teléfono de la administración y RumentisCampo-$VN.apk en el de cada colaborador. Los .aab son para subir a Google Play. Rama: $GITHUB_REF_NAME, compilación $GITHUB_RUN_NUMBER."
