name: StickerYa

on:
  push:
    paths:
      - 'stickerya/**'
      - '.github/workflows/stickerya.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compilar el APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: stickerya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk StickerYa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StickerYa-apk
          path: stickerya/StickerYa.apk
      # Siempre en el mismo enlace: .../releases/download/stickerya/StickerYa.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete stickerya --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create stickerya StickerYa.apk --repo "${{ github.repository }}" --target "${GITHUB_SHA}" \
            --title "StickerYa (última versión)" \
            --notes "Descarga StickerYa.apk en el teléfono e instálalo (permite instalar apps de origen desconocido si te lo pide). Versión ${GITHUB_SHA::7}."

  test:
    name: Probar en un emulador
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: stickerya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar app y pruebas
        run: chmod +x gradlew && ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Activar KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador y pruebas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: stickerya
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.stickerya.app.test/androidx.test.runner.AndroidJUnitRunner | tee test-result.txt
            mkdir -p screens && adb exec-out run-as com.stickerya.app tar -c files/screens > screens.tar || true
            adb logcat -d > logcat.txt || true
      - name: Capturas
        if: always()
        run: |
          mkdir -p out && tar -xf screens.tar -C out 2>/dev/null || true
          ls -la out/files/screens 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StickerYa-pruebas
          path: |
            stickerya/out
            stickerya/test-result.txt
            stickerya/logcat.txt
      # Copia de las capturas y del resultado en una referencia oculta (no es una rama), para revisarlas con git.
      - name: Publicar capturas en refs/stickerya/screens
        if: always()
        run: |
          rm -rf /tmp/shots && mkdir -p /tmp/shots
          cp -r out/files/screens/. /tmp/shots/ 2>/dev/null || true
          cp test-result.txt /tmp/shots/ 2>/dev/null || true
          grep -E "AndroidRuntime|FATAL|stickerya" logcat.txt | tail -400 > /tmp/shots/logcat-app.txt 2>/dev/null || true
          cd /tmp/shots
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "StickerYa ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/stickerya/screens
      - name: Resultado
        run: |
          cat test-result.txt
          grep -q "^OK (" test-result.txt
