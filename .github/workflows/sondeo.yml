# Sondeo de fuentes de datos (solo diagnóstico): corre al cambiar scripts/mercado/sondeo.js o a mano.
name: Sondeo de fuentes
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/mercado/sondeo.js']
  workflow_dispatch:
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: node scripts/mercado/sondeo.js
