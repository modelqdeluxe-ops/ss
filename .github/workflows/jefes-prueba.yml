name: Prueba de jefes en el juego

# Arranca Minecraft con TF Client en una pantalla virtual (xvfb + Mesa por software) y deja que la prueba de los jefes
# (tf-client/.../bosses/BossTest.java) pelee con cada jefe en un mundo plano, lo mate y saque capturas. El informe y
# las capturas (en JPEG pequeño) se suben a la rama «pruebas-jefes» (sin historia: se rehace cada vez).
# Sale en un push a una rama claude/** cuyo commit diga [prueba-jefes], o a mano (con los jefes que se quieran).

on:
  push:
    branches: ['claude/**']
    paths:
      - 'tf-client/**'
      - '.github/workflows/jefes-prueba.yml'
  workflow_dispatch:
    inputs:
      jefes:
        description: 'Jefes separados por comas (vacío = todos)'
        required: false
        default: ''

jobs:
  prueba:
    name: Pelear con los jefes
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[prueba-jefes')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tf-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pantalla virtual
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null
      - name: Jugar
        env:
          ELEGIDOS: ${{ github.event.inputs.jefes }}
          MENSAJE: ${{ github.event.head_commit.message }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          GALLIUM_DRIVER: llvmpipe
        run: |
          # Qué jefes: los del formulario, los de «[prueba-jefes=a,b]» en el commit o todos
          if [ -z "$ELEGIDOS" ]; then ELEGIDOS=$(printf '%s' "$MENSAJE" | grep -oP '\[prueba-jefes=\K[^\]]+' | head -n1 || true); fi
          export TFCLIENT_PRUEBA_JEFES="${ELEGIDOS:-1}"
          echo "Jefes: $TFCLIENT_PRUEBA_JEFES"
          chmod +x gradlew
          mkdir -p run
          printf 'pauseOnLostFocus:false\nonboardAccessibility:false\ntutorialStep:none\nrenderDistance:6\nsoundCategory_master:0.0\n' > run/options.txt
          # Con «[shaders]» en el commit: Oculus + Embeddium y el paquete Complementary Reimagined (r5.3) puesto
          EXTRA=""
          # Con «[shaders=photon]»: el paquete Photon v1.3b (el del dueño, 1.3.96) en vez de Complementary
          if printf '%s' "$MENSAJE" | grep -q '\[shaders'; then
            EXTRA="-Ptfshaders"
            export TFCLIENT_PRUEBA_SHADERS=1
            mkdir -p run/shaderpacks run/config
            if printf '%s' "$MENSAJE" | grep -q '\[shaders=photon\]'; then
              PACK=photon_v1.3b.zip
              curl -sSfL -o run/shaderpacks/$PACK https://cdn.modrinth.com/data/lLqFfGNs/versions/gUv7fBPN/photon_v1.3b.zip
            else
              PACK=ComplementaryReimagined_r5.3.zip
              curl -sSfL -o run/shaderpacks/$PACK https://cdn.modrinth.com/data/HVnmMxH1/versions/71Hn3myZ/ComplementaryReimagined_r5.3.zip
            fi
            printf 'enableShaders=true\nshaderPack=%s\n' "$PACK" > run/config/oculus.properties
            cp run/config/oculus.properties run/config/iris.properties
            echo "Con shaders: Oculus 1.8.0 + $PACK"
          fi
          # (1.3.137) Con «[accesorios]»: Accessories (y Cloth Config), para las alas en los huecos de accesorios
          # (y con «[accesorios=curios]», Curios en vez de Accessories)
          if printf '%s' "$MENSAJE" | grep -q '\[accesorios=curios\]'; then
            EXTRA="$EXTRA -Ptfaccessories=curios"
            echo "Con Curios"
          elif printf '%s' "$MENSAJE" | grep -q '\[accesorios\]'; then
            EXTRA="$EXTRA -Ptfaccessories=accessories"
            echo "Con Accessories"
          fi
          timeout 70m xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient $EXTRA --no-daemon > run/juego.log 2>&1 || echo "el juego acabó con código $?"
          tail -n 80 run/juego.log
          ls run/pruebas || true
          cat run/pruebas/informe.txt || true
      - name: Subir el informe y las capturas
        if: always()
        run: |
          python3 -m pip install --quiet pillow || true
          rm -rf /tmp/out && mkdir -p /tmp/out
          cp run/pruebas/informe.txt /tmp/out/ 2>/dev/null || echo "sin informe" > /tmp/out/informe.txt
          grep -E "TF Jefes|TF Skills|TF Void|TF Crates|Prueba de jefes|Oculus|Iris|Exception|ERROR|WARN.*(tfclient|texture)|Caused by|^\s+at net\.tierrasfantasticas" run/juego.log | tail -n 3000 > /tmp/out/registro.txt || true
          tail -n 400 run/juego.log > /tmp/out/final_del_registro.txt || true
          python3 - <<'EOF'
          import glob, os
          try:
              from PIL import Image
          except ImportError:
              Image = None
          for f in sorted(glob.glob('run/pruebas/*.png')):
              out = '/tmp/out/' + os.path.basename(f)[:-4] + '.jpg'
              if Image is None:
                  continue
              im = Image.open(f).convert('RGB')
              # (1.3.103) algunas, además, enteras en PNG: para medir rayas finas (la colita de las hadas, los pétalos);
              # (1.3.106) y el texto del pad y los muebles de los NPC
              if any(k in os.path.basename(f) for k in ('crate1_preabrir', 'crate1_05_abre', 'crate1_09_premio', 'pad_musica',
                                                         'pad_efectos', 'npc_muebles', 'npc_panel', 'pad_combate',
                                                         'pad_protecciones', 'pad_portada', 'tablista', 'crate_mundo',
                                                         'piedras_proteccion')):
                  im.save('/tmp/out/' + os.path.basename(f)[:-4] + '_entera.png')
              im.thumbnail((800, 450))
              im.save(out, quality=82)
          EOF
          # (1.3.96) los panoramas del agujero de gusano, enteros (PNG)
          cp -r run/pruebas/panoramas /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q
          git checkout -q -b pruebas-jefes
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Prueba de jefes ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pruebas-jefes
