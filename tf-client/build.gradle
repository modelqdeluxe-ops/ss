plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "${mod_version}"
group = 'net.tierrasfantasticas.tfclient'

base {
    archivesName = "tfclient-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--width', '1280', '--height', '720'
            if (project.hasProperty('tfshaders') || project.hasProperty('tfmods')) {
                // (los mixins de Oculus, Embeddium e ImmediatelyFast, compilados para el juego normal, se traducen a los
                // nombres de aquí)
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            }
            mods {
                tfclient {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'tfclient.refmap.json'
    config 'tfclient.mixins.json'
}

// La prueba en el juego con shaders (commit con [shaders]: .github/workflows/jefes-prueba.yml pasa -Ptfshaders): Oculus
// y Embeddium solo para jugar en la prueba; el mod no depende de ellos (vacio/ShaderPacks los busca por reflexión).
// (1.3.106) Con [mods=immediatelyfast] (-Ptfmods=immediatelyfast): ImmediatelyFast, el mod de optimización que agrupa
// el dibujo de la interfaz y de lo inmediato (en muchos modpacks), para ver lo que el dueño ve.
if (project.hasProperty('tfshaders') || project.hasProperty('tfmods')) {
    repositories {
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    if (project.hasProperty('tfshaders')) {
        runtimeOnly fg.deobf('maven.modrinth:embeddium:0.3.31+mc1.20.1')
        runtimeOnly fg.deobf('maven.modrinth:oculus:1.20.1-1.8.0')
    }
    if (project.hasProperty('tfmods') && project.property('tfmods').toString().contains('immediatelyfast')) {
        runtimeOnly fg.deobf('maven.modrinth:immediatelyfast:1.5.5+1.20.4-forge')
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : 'tfclient',
            'Specification-Vendor'    : 'Tierras Fantásticas',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'Tierras Fantásticas',
            'MixinConfigs'            : 'tfclient.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
