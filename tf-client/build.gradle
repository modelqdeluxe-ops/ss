plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "${mod_version}"
group = 'net.tierrasfantasticas.tfclient'

base {
    archivesName = "tfclient-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--width', '1280', '--height', '720'
            if (project.hasProperty('tfshaders') || project.hasProperty('tfaccessories')) {
                // (los mixins de Oculus y Embeddium (y de Accessories), compilados para el juego normal, se traducen a los nombres de aquí)
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            }
            mods {
                tfclient {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'tfclient.refmap.json'
    config 'tfclient.mixins.json'
}

// La prueba en el juego con shaders (commit con [shaders]: .github/workflows/jefes-prueba.yml pasa -Ptfshaders): Oculus
// y Embeddium solo para jugar en la prueba; el mod no depende de ellos (vacio/ShaderPacks los busca por reflexión).
// (1.3.137) Con [accesorios] en el commit (-Ptfaccessories): Accessories y Cloth Config, para probar las alas en los huecos
// de accesorios (el mod los usa por reflexión, TFAccessorySlots; no depende de ellos).
if (project.hasProperty('tfshaders') || project.hasProperty('tfaccessories')) {
    repositories {
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
    }
}

// (1.3.139, el dueño: «que los objetos del TF Client no salgan en el JEI») la API de JEI solo para compilar el plugin que
// los oculta (compat/jei/TFJeiPlugin); el mod no depende de JEI. Con [jei] en el commit (-Ptfjei), JEI para la prueba.
repositories {
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.106')
    if (project.hasProperty('tfjei')) {
        runtimeOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.20.0.106')
    }
    if (project.hasProperty('tfshaders')) {
        runtimeOnly fg.deobf('maven.modrinth:embeddium:0.3.31+mc1.20.1')
        runtimeOnly fg.deobf('maven.modrinth:oculus:1.20.1-1.8.0')
    }
    if (project.hasProperty('tfaccessories')) {
        // -Ptfaccessories=curios: Curios en vez de Accessories
        if (project.property('tfaccessories') == 'curios') {
            runtimeOnly fg.deobf('maven.modrinth:curios:5.14.1+1.20.1')
        } else {
            runtimeOnly fg.deobf('maven.modrinth:cloth-config:11.1.136+forge')
            runtimeOnly fg.deobf('maven.modrinth:accessories:1.0.0-beta.49+1.20.1')
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : 'tfclient',
            'Specification-Vendor'    : 'Tierras Fantásticas',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'Tierras Fantásticas',
            'Copyright'               : 'Copyright (c) 2026 Tierras Fantásticas. All rights reserved.',
            'License'                 : 'Proprietary - see LICENSE',
            'MixinConfigs'            : 'tfclient.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
