modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"

[[mods]]
modId="tfclient"
version="${mod_version}"
displayName="TF Client"
description='''Cliente oficial de Tierras Fantásticas: pantalla de carga y menú principal propios, conexión directa al servidor y mundo local. Añade los objetos de los sets de Tierras Fantásticas (armas, herramientas, armaduras y cosméticos animados) y el comando /tf. En el servidor hace de puente con la web: entrega las compras de la tienda y manda los jugadores conectados.'''
logoFile="tfclient_logo.png"
authors="Tierras Fantásticas"
# Registra los objetos de los sets: hace falta la misma versión en el servidor y en los jugadores.
displayTest="MATCH_VERSION"

[[dependencies.tfclient]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tfclient]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.20.2)"
    ordering="NONE"
    side="BOTH"
