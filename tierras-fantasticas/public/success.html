<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compra completada — Tierras Fantásticas</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
</head>
<body>
  <main class="result">
    <div class="result-card">
      <div class="result-icon" id="icon">⏳</div>
      <h1 id="title">Comprobando tu pago…</h1>
      <p class="muted" id="message">Un momento, estamos confirmando la transacción con PayPal.</p>
      <dl id="details" hidden>
        <dt>Pedido</dt><dd id="d-order"></dd>
        <dt>Jugador</dt><dd id="d-user"></dd>
        <dt>Producto</dt><dd id="d-product"></dd>
        <dt>Total</dt><dd id="d-total"></dd>
        <dt>Entrega</dt><dd id="d-delivery"></dd>
      </dl>
      <a href="/" class="btn btn-primary">Volver al inicio</a>
    </div>
  </main>

  <script>
    (async () => {
      const $ = (id) => document.getElementById(id);
      const orderId = new URLSearchParams(location.search).get('order');
      const deliveryText = {
        delivered: '✅ Entregado en el servidor',
        delivering: '⏳ Entregando…',
        pending: '⏳ Procesando…',
        manual: '🛠️ El staff lo entregará en breve',
        delivery_failed: '🛠️ El staff lo entregará en breve',
        awaiting_payment: '⏳ Esperando confirmación de PayPal',
        failed: '❌ Pago no completado',
        error: '⚠️ Revisión manual',
      };
      const PAID = ['delivered', 'delivering', 'manual', 'delivery_failed'];

      if (!orderId) {
        $('icon').textContent = '❓';
        $('title').textContent = 'Pedido no encontrado';
        $('message').textContent = 'No hemos encontrado ningún pedido asociado a esta página.';
        return;
      }
      $('d-order').textContent = orderId;

      // Si PayPal aún está confirmando el pago, volvemos a consultar durante un rato.
      for (let attempt = 0; attempt < 15; attempt++) {
        let order;
        try {
          const res = await fetch(`/api/order/${encodeURIComponent(orderId)}`);
          order = await res.json();
          if (!res.ok) throw new Error(order.error);
        } catch {
          $('icon').textContent = '⚠️';
          $('title').textContent = 'No pudimos comprobar el pedido';
          $('message').textContent = 'Si se realizó el cargo, recibirás tu compra igualmente. Contáctanos por Discord con tu número de pedido.';
          return;
        }

        const total = new Intl.NumberFormat('es', { style: 'currency', currency: order.currency })
          .format(order.amount / 100);
        $('d-user').textContent = order.username;
        $('d-product').textContent = order.quantity > 1 ? `${order.product} ×${order.quantity}` : order.product;
        $('d-total').textContent = total;
        $('d-delivery').textContent = deliveryText[order.status] || order.status;
        $('details').hidden = false;

        if (PAID.includes(order.status)) {
          $('icon').textContent = '🎉';
          $('title').textContent = '¡Gracias por tu compra!';
          $('message').textContent = order.status === 'delivered'
            ? 'Tu pago se ha completado y la compra ya está en el servidor. ¡Disfrútala!'
            : 'Tu pago se ha completado. El staff entregará tu compra en breve.';
          return;
        }
        if (order.status === 'failed') {
          $('icon').textContent = '❌';
          $('title').textContent = 'El pago no se completó';
          $('message').textContent = 'No se ha realizado ningún cargo. Puedes volver a la tienda e intentarlo de nuevo.';
          return;
        }
        if (order.status === 'error') {
          $('icon').textContent = '⚠️';
          $('title').textContent = 'Pedido en revisión';
          $('message').textContent = 'Hubo un problema al verificar el pago. Contáctanos por Discord con tu número de pedido.';
          return;
        }
        $('icon').textContent = '⏳';
        $('title').textContent = 'Pago en proceso';
        $('message').textContent = 'PayPal aún está confirmando el pago. Te entregaremos la compra en cuanto se complete; puedes cerrar esta página.';
        await new Promise((r) => setTimeout(r, 4000));
      }
    })();
  </script>
</body>
</html>
